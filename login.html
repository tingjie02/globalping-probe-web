<!doctype html>
<html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign in · Globalping Probe</title>
        <style>
            *{box-sizing:border-box}
            body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif;color:#17322f;background:radial-gradient(ellipse at 85% 10%,#dbece2,transparent 40%),#f1f4f0}
            .shell{width:min(900px,100%);display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1px solid #dce5df;border-radius:26px;overflow:hidden;box-shadow:0 30px 80px #21433414}
            .visual{min-height:440px;padding:42px;color:#eafdf2;background:#102f28;display:flex;flex-direction:column;justify-content:space-between}
            .brand{font-size:14px;font-weight:750}
            .visual h2{font-size:40px;letter-spacing:-.04em}
            .content{padding:58px;display:flex;flex-direction:column;justify-content:center}
            h1{font-size:30px;margin:0 0 10px}
            .muted{color:#687f73;font-size:14px}
            .badge{align-self:flex-start;margin:18px 0 24px;padding:8px 12px;border:1px solid #d4eddd;border-radius:100px;background:#edf9f0;color:#28734b;font-size:12px}
            label{font-size:13px;font-weight:650;display:block;margin-bottom:8px}
            input{width:100%;height:46px;padding:0 12px;margin-bottom:18px;border:1px solid #d5e0d9;border-radius:10px;font:inherit;color:#17322f}
            button{width:100%;border:0;border-radius:10px;padding:14px;background:#173f33;color:white;font-weight:700;cursor:pointer}
            .foot{margin-top:22px;color:#91a198;font-size:12px}
            @media(max-width:680px){
                .shell{grid-template-columns:1fr}
                .visual{min-height:190px;padding:26px}
                .visual h2{font-size:30px}.content{padding:36px 28px}
            }
        </style>
</head>
<body>
    <main class="shell">
        <aside class="visual">
            <div class="brand">◎ &nbsp; globalping / probe</div>
            <h2>A clearer view of your connection.</h2>
        </aside>
        <section class="content">
            <h1>Welcome back</h1>
            <p class="muted">Sign in to continue to your probe page.</p>
            <div class="badge">● Web interface is running</div>
            <form method="post" action="/login"><label for="username">Username</label>
                <input id="username" name="username" autocomplete="username" required>
                <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
                <button type="submit">Sign in →</button></form><p class="foot">Globalping Probe · Web interface</p>
        </section>
    </main>
</body>
</html>
